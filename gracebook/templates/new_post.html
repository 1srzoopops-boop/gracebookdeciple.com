{% extends "base.html" %}
{% block content %}
  <h2>Share with the fellowship</h2>
  <form method="POST">
    <label for="section"><strong>Where should this go?</strong></label>
    <br>
    <select name="section" id="section" style="padding:8px; border-radius:6px; border:1px solid #ccc; margin: 8px 0 15px;">
      {% for key, section in sections.items() %}
        <option value="{{ key }}">{{ section.label }}</option>
      {% endfor %}
    </select>
    <br>
    <textarea name="content" rows="5" placeholder="Share with the fellowship..." required></textarea>
    <br>
    <button type="submit">Post</button>
  </form>
{% endblock %}
