<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracebook</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fdf8f0;
      color: #3b2f2f;
      margin: 0;
      padding: 0;
    }
    header {
      background: #6b4226;
      color: #fdf8f0;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2em;
      letter-spacing: 1px;
    }
    header p {
      margin: 5px 0 0;
      font-style: italic;
      opacity: 0.9;
    }
    nav {
      background: #8a5a3c;
      text-align: center;
      padding: 10px;
    }
    nav a {
      color: #fdf8f0;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .post {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .prayer-tag {
      display: inline-block;
      background: #d9a441;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8em;
      margin-bottom: 8px;
    }
    .post-content {
      font-size: 1.1em;
      line-height: 1.5;
    }
    .comments {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .comment {
      font-size: 0.95em;
      margin-bottom: 6px;
      color: #555;
    }
    form textarea, form input[type=text] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 1em;
      box-sizing: border-box;
    }
    button, .btn {
      background: #6b4226;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 8px;
    }
    button:hover, .btn:hover {
      background: #8a5a3c;
    }
    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .comment-form input {
      flex: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gracebook</h1>
    <p>Where two or more gather, He is there</p>
  </header>
  <nav>
    <a href="/">Feed</a>
    <a href="/prayer-wall">Prayer Wall</a>
    <a href="/testimonies">Testimonies</a>
    <a href="/discussion">Discussion</a>
    <a href="/post/new">Share a Post</a>
    <a href="/profile">Profile</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
