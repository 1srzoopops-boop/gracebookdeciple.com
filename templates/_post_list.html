{% if verse %}
  <p style="font-style: italic; color: #6b4226;">{{ verse }}</p>
{% endif %}

{% if posts|length == 0 %}
  <p>No posts here yet. Be the first to share something with the fellowship.</p>
{% endif %}

{% for post in posts %}
  <div class="post">
    <div class="post-content">{{ post.content }}</div>
    <div class="comments">
      {% for comment in post.comments %}
        <div class="comment">{{ comment.content }}</div>
      {% endfor %}
      <form class="comment-form" method="POST" action="/post/{{ post.id }}/comment">
        <input type="text" name="content" placeholder="Write an encouragement..." required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
{% endfor %}
